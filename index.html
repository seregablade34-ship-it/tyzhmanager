<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#тыжменеджер — дневник целей</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="#тыжменеджер" />
    <meta name="description" content="#тыжменеджер — дневник целей эффективного человека. Ставь цели, планируй день, отслеживай прогресс." />
  </head>
  <body>
    <div id="root">Загрузка...</div>

    <script>
      // 1. Убиваем ВСЕ старые Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
          if (regs.length > 0) {
            document.getElementById('root').textContent = 'SW очищен, перезагрузка...';
            setTimeout(function() { location.reload(); }, 1000);
          }
        });
      }

      // 2. Очищаем старые кеши
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }

      // 3. Ловим ошибки
      window.addEventListener('error', function(e) {
        document.getElementById('root').innerHTML =
          '<div style="padding:20px;color:red;font-size:14px;word-break:break-all">' +
          '<h2>Ошибка</h2><p>' + e.message + '</p>' +
          '<p>Файл: ' + e.filename + '</p>' +
          '<p>Строка: ' + e.lineno + '</p></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('root').innerHTML =
          '<div style="padding:20px;color:red;font-size:14px;word-break:break-all">' +
          '<h2>Ошибка Promise</h2><p>' + e.reason + '</p></div>';
      });

      // 4. Таймаут — если через 10 сек приложение не загрузилось
      setTimeout(function() {
        var el = document.getElementById('root');
        if (el && el.textContent === 'Загрузка...') {
          el.innerHTML =
            '<div style="padding:20px;color:orange;font-size:14px">' +
            '<h2>⏱ Приложение не загрузилось за 10 сек</h2>' +
            '<p>Попробуйте обновить страницу</p>' +
            '<button onclick="location.reload()" style="padding:10px 20px;background:#2563eb;color:white;border:none;border-radius:8px;font-size:16px;margin-top:10px">🔄 Обновить</button>' +
            '</div>';
        }
      }, 10000);
    </script>

    <!-- ГЛАВНЫЙ СКРИПТ -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
