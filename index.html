<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Заголовок -->
    <title>#тыжменеджер — дневник целей</title>

    <!-- Иконки -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- PWA Манифест -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Цвет верхней панели браузера -->
    <meta name="theme-color" content="#2563eb" />

    <!-- iOS PWA поддержка -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="#тыжменеджер" />

    <!-- SEO описание -->
    <meta name="description" content="#тыжменеджер — дневник целей эффективного человека. Ставь цели, планируй день, отслеживай прогресс." />
  </head>
  <body>
    <div id="root">Загрузка...</div>

    <!-- Отлов ошибок (показывает на экране) -->
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('root').innerHTML =
          '<div style="padding:20px;color:red;font-size:14px;word-break:break-all">' +
          '<h2>Ошибка загрузки</h2>' +
          '<p>' + e.message + '</p>' +
          '<p>Файл: ' + e.filename + '</p>' +
          '<p>Строка: ' + e.lineno + '</p>' +
          '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('root').innerHTML =
          '<div style="padding:20px;color:red;font-size:14px;word-break:break-all">' +
          '<h2>Ошибка Promise</h2>' +
          '<p>' + e.reason + '</p>' +
          '</div>';
      });
    </script>

    <!-- ⚡ ГЛАВНЫЙ СКРИПТ ПРИЛОЖЕНИЯ -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Регистрация Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) { console.log('✅ SW registered:', reg.scope) })
            .catch(function(err) { console.log('❌ SW failed:', err) })
        })
      }
    </script>
  </body>
</html>
